jenkins:
  systemMessage: "Production Jenkins - Ready"

  numExecutors: 1   # Set to 1 so the controller can execute pipeline builds

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin123

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://localhost:8080/
